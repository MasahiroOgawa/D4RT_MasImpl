# Quick 100-step test for paper losses validation
# Verifies full pipeline with all paper losses and tracked GT

defaults:
  - /model: vit_b_movi

experiment_name: d4rt_test_paper_100
seed: 42
model: vit_b_movi

training:
  max_steps: 100  # Quick test
  batch_size: 1
  num_workers: 0
  gradient_accumulation_steps: 4
  mixed_precision: false
  gradient_checkpointing: true
  clip_grad_norm: 0.5
  log_every_n_steps: 10
  val_every_n_steps: 1000  # No validation during test
  save_every_n_steps: 1000  # No checkpoints during test
  num_queries_per_step: 64

optimizer:
  type: adamw
  lr: 1e-5
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.01

scheduler:
  type: cosine
  warmup_steps: 10
  T_max: 100
  eta_min: 1e-6

# Loss weights matching D4RT paper exactly (INCLUDING CONFIDENCE!)
loss_weights:
  l1_3d: 1.0                    # Primary 3D position loss
  l2_2d: 0.1                    # 2D reprojection loss
  normal: 0.5                   # Surface normal loss (paper value)
  motion: 0.1                   # Temporal motion consistency
  visibility: 0.1               # Occlusion handling
  confidence: 0.2               # Confidence weighting (NEW from paper)
  use_paper_formula_3d: true    # Enable paper's mean depth + signed log transform

dataset:
  name: kubric
  data_dir: data/kubric
  num_frames: 24
  resolution: [256, 256]
  train_split: train
  val_split: val
  augmentation: {}

query_sampling:
  num_queries: 128
  visible_ratio: 0.5
  occluded_ratio: 0.25
  random_ratio: 0.25
  temporal_sampling: uniform

logging:
  use_wandb: false
  wandb_project: d4rt
  wandb_entity: null
  log_dir: logs
  save_dir: checkpoints/test_paper_100

hardware:
  num_gpus: 1
  device: cuda
  precision: 32
