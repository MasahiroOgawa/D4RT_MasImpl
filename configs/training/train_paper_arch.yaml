# Training configuration with Paper Architecture (Figure 7)
# Uses local+global attention blocks for proper 3D tracking

experiment_name: d4rt_paper_arch
seed: 42
model: vit_b_d4rt  # Use paper architecture with local+global attention

training:
  max_steps: 50000
  batch_size: 1
  num_workers: 4
  gradient_accumulation_steps: 8  # Effective batch size of 8
  mixed_precision: fp16   # FP16 for faster training
  gradient_checkpointing: true
  clip_grad_norm: 1.0
  log_every_n_steps: 100
  val_every_n_steps: 2500
  save_every_n_steps: 5000
  num_queries_per_step: 64  # Reduced for memory

optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.03

scheduler:
  type: cosine
  warmup_steps: 2500
  T_max: 50000
  eta_min: 1e-6

# Paper loss weights
loss_weights:
  l1_3d: 1.0
  l2_2d: 0.1
  normal: 0.5
  motion: 0.1
  visibility: 0.1
  confidence: 0.2
  use_paper_formula_3d: true  # Mean depth normalization + signed-log transform

dataset:
  name: kubric
  data_dir: data/kubric
  num_frames: 24
  resolution: [256, 256]
  train_split: train
  val_split: val
  augmentation: {}

query_sampling:
  num_queries: 128
  visible_ratio: 0.5
  occluded_ratio: 0.25
  random_ratio: 0.25
  temporal_sampling: uniform

logging:
  use_wandb: false
  wandb_project: d4rt
  wandb_entity: null
  log_dir: logs
  save_dir: checkpoints

hardware:
  num_gpus: 1
  device: cuda
  precision: 16
