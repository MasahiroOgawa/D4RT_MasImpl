# Training configuration for 50k steps on full MOVi-A dataset
# Goal: Match paper training procedure for proper tracking performance

defaults:
  - /model: vit_b_movi

experiment_name: d4rt_train_50k_movi
seed: 42
model: vit_b_movi

training:
  max_steps: 50000  # 10× longer than initial 5k training
  batch_size: 1  # Keep at 1 for memory
  num_workers: 0  # Disable multiprocessing
  gradient_accumulation_steps: 4  # Effective batch size of 4
  mixed_precision: false  # Keep FP32 for stability
  gradient_checkpointing: true  # Essential for memory
  clip_grad_norm: 1.0  # Match paper gradient clipping (L2-norm)
  log_every_n_steps: 100  # Log more frequently for monitoring
  val_every_n_steps: 1000  # Validate every 1k steps
  save_every_n_steps: 5000  # Save checkpoint every 5k steps
  num_queries_per_step: 128  # Restore to 128 (paper uses 2048)

optimizer:
  type: adamw
  lr: 1e-4  # Match paper initial learning rate
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.03  # Match paper weight decay

scheduler:
  type: cosine_with_warmup
  warmup_steps: 2500  # Match paper warmup schedule
  T_max: 50000
  eta_min: 1e-6  # Match paper final learning rate

loss_weights:
  l1_3d: 1.0  # Primary supervision
  l2_2d: 0.1  # Image-space supervision (fixed)
  normal: 0.0  # No ground truth normals in MOVi
  motion: 0.1  # Temporal consistency
  visibility: 0.1  # Occlusion handling

dataset:
  name: kubric
  data_dir: data/kubric
  num_frames: 24
  resolution: [256, 256]
  train_split: train
  val_split: val
  augmentation: {}

query_sampling:
  num_queries: 128
  visible_ratio: 0.5
  occluded_ratio: 0.25
  random_ratio: 0.25
  temporal_sampling: uniform

logging:
  use_wandb: false
  wandb_project: d4rt
  wandb_entity: null
  log_dir: logs
  save_dir: checkpoints

hardware:
  num_gpus: 1
  device: cuda
  precision: 32
