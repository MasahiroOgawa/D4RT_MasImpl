# Quick test configuration - 5 steps
# For verifying training pipeline works

experiment_name: d4rt_quick_test
seed: 42
model: vit_b_movi

training:
  max_steps: 5
  batch_size: 1
  num_workers: 0
  gradient_accumulation_steps: 1
  mixed_precision: false
  gradient_checkpointing: false
  clip_grad_norm: 10.0
  log_every_n_steps: 1
  val_every_n_steps: 1000
  save_every_n_steps: 1000
  num_queries_per_step: 64
  z_gradient_scale: 1.0
  loss_weights:
    l1_3d: 1.0
    l2_2d: 0.1
    normal: 0.5
    motion: 0.1
    visibility: 0.1
    confidence: 0.2
    depth_aux: 1.0
    use_paper_formula_3d: true

optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.03

scheduler:
  type: cosine
  warmup_steps: 0
  T_max: 5
  eta_min: 1e-6

dataset:
  name: kubric
  data_dir: data/kubric
  num_frames: 24
  resolution: [256, 256]
  train_split: train
  val_split: val
  augmentation: {}

query_sampling:
  num_queries: 64
  visible_ratio: 0.5
  occluded_ratio: 0.25
  random_ratio: 0.25
  temporal_sampling: uniform

logging:
  use_wandb: false
  wandb_project: d4rt
  wandb_entity: null
  log_dir: logs
  save_dir: checkpoints

hardware:
  num_gpus: 1
  device: cuda
  precision: 32
