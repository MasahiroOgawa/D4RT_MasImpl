# D4RT Training Configuration (Paper-exact settings)
#
# Loss function follows the paper formula:
# L = (1/N) * sum[ c*λ3D*L3D - λconf*log(c) + λ2D*L2D + λvis*Lvis + λdisp*Ldisp + λnormal*Lnormal ]

# Model configuration
model: vit_b_d4rt                    # Use paper architecture

# Loss weights (from paper)
loss:
  use_paper_formula: true            # Use confidence-weighted loss
  loss_weights:
    l1_3d: 1.0                       # λ3D - primary 3D supervision
    l2_2d: 0.1                       # λ2D - 2D coordinate loss
    visibility: 0.1                  # λvis - visibility loss
    motion: 0.1                      # λdisp - motion displacement loss
    confidence: 0.2                  # λconf - confidence penalty weight
    normal: 0.5                      # λnormal - surface normal loss
    use_paper_formula_3d: true       # Use mean depth normalization + signed log

# Training settings
training:
  batch_size: 4
  num_epochs: 100
  gradient_clip: 1.0
  accumulate_grad_batches: 1

  # Optimizer (AdamW)
  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.999]

  # Learning rate scheduler
  scheduler:
    name: cosine
    warmup_epochs: 5
    min_lr: 1.0e-6

# Data settings
data:
  dataset: kubric_movi              # MOVi-E dataset
  train_split: train
  val_split: validation
  num_workers: 4
  pin_memory: true

  # Video processing
  num_frames: 24                    # Sample 24 frames per video
  frame_stride: 1                   # No frame skipping
  resolution: [256, 256]            # Resize to square 256x256

  # Query sampling
  queries_per_video: 256            # Number of query points per video
  query_sampling: stratified        # Stratified sampling across frames

# Logging and checkpointing
logging:
  log_every_n_steps: 100
  val_every_n_epochs: 1
  save_every_n_epochs: 5

checkpointing:
  save_top_k: 3
  monitor: val/loss_total
  mode: min

# Hardware
hardware:
  accelerator: auto
  devices: auto
  precision: 16-mixed               # Mixed precision training
