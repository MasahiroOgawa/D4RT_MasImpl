# Training configuration for 50k steps on full MOVi-A with paper losses
# Combines 50k training scale with exact paper loss functions from Phase 13.5
# Model config is loaded from configs/model/{model}.yaml

experiment_name: d4rt_train_50k_movi_paper
seed: 42
model: vit_b_movi

# CRITICAL: VideoMAE pretrained weights for encoder
# Paper ablation (Table 11): Random init = 0.738 depth error, VideoMAE = 0.302
pretrained_weights: pretrained/videomae_vit_b_k400_800e.pth

training:
  max_steps: 50000
  batch_size: 1
  num_workers: 0
  gradient_accumulation_steps: 4  # Effective batch size of 4
  mixed_precision: false  # FP32 for stability
  gradient_checkpointing: true
  clip_grad_norm: 10.0  # Paper: "Gradients are clipped to a maximum L2-norm of 10"
  log_every_n_steps: 100
  val_every_n_steps: 1000
  save_every_n_steps: 5000
  num_queries_per_step: 128

optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.03

scheduler:
  type: cosine
  warmup_steps: 2500
  T_max: 50000
  eta_min: 1e-6

# Paper loss weights (from Phase 13.5)
loss_weights:
  l1_3d: 1.0
  l2_2d: 0.1
  normal: 0.5
  motion: 0.1
  visibility: 0.1
  confidence: 0.2
  use_paper_formula_3d: true  # Mean depth normalization + signed-log transform

dataset:
  name: kubric
  data_dir: data/kubric
  num_frames: 24
  resolution: [256, 256]
  train_split: train
  val_split: val
  augmentation: {}

query_sampling:
  num_queries: 128
  visible_ratio: 0.5
  occluded_ratio: 0.25
  random_ratio: 0.25
  temporal_sampling: uniform

logging:
  use_wandb: false
  wandb_project: d4rt
  wandb_entity: null
  log_dir: logs
  save_dir: checkpoints

hardware:
  num_gpus: 1
  device: cuda
  precision: 32
