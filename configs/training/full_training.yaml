# Full Training Configuration
# For training ViT-g on full dataset mix

defaults:
  - /model: vit_g

experiment_name: d4rt_full_vit_g
seed: 42

# Model
model: vit_g

# Training
training:
  max_steps: 500000
  batch_size: 4  # Per GPU (32 total with 8 GPUs)
  num_workers: 8
  gradient_accumulation_steps: 1
  mixed_precision: bf16  # bfloat16 for A100/H100
  gradient_checkpointing: true  # CRITICAL for ViT-g
  clip_grad_norm: 1.0
  log_every_n_steps: 100
  val_every_n_steps: 2000
  save_every_n_steps: 5000
  num_queries_per_step: 2048

# Optimizer
optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.05

# Learning Rate Scheduler
scheduler:
  type: cosine
  warmup_steps: 10000
  T_max: 500000
  eta_min: 1e-6

# Loss Weights
loss_weights:
  l1_3d: 1.0
  l2_2d: 0.1
  normal: 0.05
  motion: 0.1
  visibility: 0.1

# Dataset Mix (weights sum to 1.0)
datasets:
  kubric:
    weight: 0.15
    data_dir: data/kubric
  point_odyssey:
    weight: 0.10
    data_dir: data/point_odyssey
  scannet:
    weight: 0.15
    data_dir: data/scannet
  co3dv2:
    weight: 0.10
    data_dir: data/co3dv2
  waymo:
    weight: 0.15
    data_dir: data/waymo
  tartanair:
    weight: 0.10
    data_dir: data/tartanair
  virtual_kitti:
    weight: 0.05
    data_dir: data/virtual_kitti
  blended_mvs:
    weight: 0.05
    data_dir: data/blended_mvs
  mvs_synth:
    weight: 0.05
    data_dir: data/mvs_synth
  dynamic_replica:
    weight: 0.10
    data_dir: data/dynamic_replica

# Common dataset settings
dataset_config:
  num_frames: 48
  resolution: [256, 256]
  train_split: train
  val_split: val
  # Data augmentation (training only)
  augmentation:
    random_crop: true
    crop_size: [224, 224]
    horizontal_flip: true
    flip_prob: 0.5
    color_jitter: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
    frame_dropout: true
    frame_dropout_prob: 0.1
    time_reversal: true
    time_reversal_prob: 0.1

# Query Sampling
query_sampling:
  num_queries: 2048
  visible_ratio: 0.5
  occluded_ratio: 0.25
  random_ratio: 0.25
  temporal_sampling: uniform

# Logging
logging:
  use_wandb: true
  wandb_project: d4rt
  wandb_entity: null
  log_dir: logs
  save_dir: checkpoints
  # Log visualizations
  log_images: true
  log_images_every_n_steps: 1000
  num_vis_samples: 4

# Hardware
hardware:
  num_gpus: 8
  device: cuda
  distributed_backend: nccl
  find_unused_parameters: false

# Checkpointing
checkpoint:
  save_best: true
  monitor: val/loss_3d
  mode: min
  save_top_k: 3
  save_last: true
