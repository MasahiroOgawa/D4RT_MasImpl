# Training on TAP-Vid-3D (drivetrack + pstudio)
# Small dataset (~200 samples) - designed for overfitting first, then test evaluation

experiment_name: d4rt_tapvid3d
seed: 42
model: vit_b_movi

# VideoMAE pretrained weights
pretrained_weights: pretrained/videomae_vit_b_k400_800e.pth

training:
  max_steps: 10000
  batch_size: 1
  num_workers: 0
  gradient_accumulation_steps: 4
  mixed_precision: false
  gradient_checkpointing: true
  clip_grad_norm: 10.0
  log_every_n_steps: 50
  val_every_n_steps: 500
  save_every_n_steps: 1000
  num_queries_per_step: 128
  loss_weights:
    l1_3d: 1.0
    l2_2d: 0.1
    normal: 0.5
    motion: 0.1
    visibility: 0.1
    confidence: 0.2
    depth: 1.0
    norm_mode: paper

optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.03

scheduler:
  type: cosine
  warmup_steps: 500
  T_max: 10000
  eta_min: 1e-6

dataset:
  name: tapvid3d
  data_dir: data/tapvid3d
  num_frames: 24
  resolution: [256, 256]
  subsets: [drivetrack, pstudio]
  train_ratio: 0.8
  augmentation: {}

query_sampling:
  num_queries: 128
  visible_ratio: 0.5
  occluded_ratio: 0.25
  random_ratio: 0.25
  temporal_sampling: uniform

logging:
  use_wandb: false
  wandb_project: d4rt
  wandb_entity: null
  log_dir: logs
  save_dir: checkpoints_tapvid3d

hardware:
  num_gpus: 1
  device: cuda
  precision: 32
