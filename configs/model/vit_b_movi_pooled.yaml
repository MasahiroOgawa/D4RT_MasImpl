# ViT-B configuration for MOVi dataset with context pooling
# This config enables context pooling to improve cross-attention gradient flow
# Based on debugging results showing uniform attention over 3072 tokens
#
# Architecture differences from original D4RT paper:
# - LayerNorm after patch embedding (use_patch_norm: true) for scale balance
# - Original D4RT uses VideoMAE pretrained weights without this normalization
# See README.md for details.

name: vit_b_movi_pooled

# Encoder configuration (same as vit_b_movi)
encoder:
  name: SpatioTemporalViT
  num_layers: 12
  hidden_dim: 768  # Note: renamed from embed_dim for config consistency
  num_heads: 12
  mlp_ratio: 4.0
  dropout: 0.0
  attention_dropout: 0.0
  drop_path_rate: 0.1

  # Patching configuration
  patch_size: [2, 16, 16]  # [T, H, W]

  # Input configuration (MOVi-A format)
  input_resolution: [24, 256, 256]  # [T, H, W] - MOVi-A has 24 frames @ 256x256

  # Gradient checkpointing
  use_checkpoint: true

  # LayerNorm after patch embedding (not in original D4RT, but helps maintain
  # scale balance between patch features and positional embeddings)
  # Set to false if using VideoMAE pretrained weights for strict paper reproduction
  use_patch_norm: true

  # VideoMAE pretrained weights path (optional)
  # Download from: https://github.com/MCG-NJU/VideoMAE
  # pretrained_weights: null  # e.g., "pretrained/videomae_vit_b.pth"

# Decoder configuration with context pooling
decoder:
  name: CrossAttentionDecoder
  num_layers: 8
  hidden_dim: 512
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  attention_dropout: 0.0
  drop_path_rate: 0.1

  # Context pooling: reduces 3072 tokens to 128 for better attention gradient flow
  # This allows attention to develop sharper patterns instead of near-uniform distribution
  context_pool_tokens: 128
  context_input_tokens: 3072  # 12 temporal × 16 × 16 spatial patches

# Query encoder configuration
query_encoder:
  fourier:
    num_frequencies: 10  # → 40 dims
    max_frequency: 9  # 2^9 = 512
  temporal:
    embedding_dim: 256
    max_frames: 64
  patch_cnn:
    patch_size: 9
    channels: [64, 128]
    output_dim: 256
  output_dim: 512  # Final projection dimension

# Model statistics
# Encoder: ~86M parameters (ViT-B backbone)
# Decoder: ~48M parameters (8 layers × 512 dim) + context pooling (~1.6M)
# Query Encoder: ~1M parameters
# Total: ~137M parameters
