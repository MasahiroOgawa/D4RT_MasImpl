# ViT-L (Medium) Configuration
# Total parameters: ~451M (307M encoder + 144M decoder)

name: vit_l

encoder:
  type: spatio_temporal_vit
  num_layers: 24
  hidden_dim: 1024
  num_heads: 16
  mlp_ratio: 4.0
  patch_size: [2, 16, 16]  # (temporal, height, width)
  input_resolution: [48, 256, 256]  # (T, H, W)
  num_patches: 6144  # (48/2) * (256/16) * (256/16)
  dropout: 0.0
  attention_dropout: 0.0
  drop_path_rate: 0.2
  use_checkpoint: true  # Enable gradient checkpointing to save memory

decoder:
  type: cross_attention_decoder
  num_layers: 8
  hidden_dim: 512
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  attention_dropout: 0.0
  drop_path_rate: 0.1

query_encoder:
  fourier:
    num_frequencies: 10  # → 40 dims
    max_frequency: 9  # 2^9 = 512
  temporal:
    embedding_dim: 256
    max_frames: 128
  patch_cnn:
    patch_size: 9
    channels: [64, 128]
    output_dim: 256
  output_dim: 512  # Final projection dimension

output_heads:
  xyz:
    type: linear
    input_dim: 512
    output_dim: 3
  visibility:
    type: linear
    input_dim: 512
    output_dim: 1
